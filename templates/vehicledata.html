<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Insurance Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Color Palette */
            --bg-gradient-start: #0f172a; /* Slate 900 */
            --bg-gradient-end: #1e293b;   /* Slate 800 */
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-border: rgba(255, 255, 255, 0.1);
            --success-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--input-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--input-border);
            padding-bottom: 20px;
        }

        h1 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        /* Helper text style for the (0: No, 1: Yes) parts */
        .label-hint {
            color: var(--accent-gold);
            font-weight: 400;
            font-size: 0.8rem;
            margin-left: 4px;
            opacity: 0.9;
        }

        input, select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent-gold);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.1);
        }

        /* FIX FOR INVISIBLE OPTIONS */
        /* This forces the dropdown menu items to have a white background and dark text */
        option {
            background-color: #fff;
            color: #333;
        }

        /* Button Styling */
        button[type="submit"] {
            grid-column: span 2;
            margin-top: 20px;
            background: linear-gradient(to right, #fbbf24, #d97706);
            color: #1e293b;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(251, 191, 36, 0.2);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        /* Result Box */
        .result-box {
            grid-column: span 2;
            margin-top: 30px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-green);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .result-box h2 {
            color: var(--success-green);
            font-size: 1.2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            button[type="submit"] {
                grid-column: span 1;
            }
            .container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vehicle Insurance Prediction</h1>
            <p class="subtitle">AI-Powered Premium Calculation System</p>
        </header>

        <form method="post" action="/">
            
            <!-- Gender -->
            <div class="form-group">
                <label for="Gender">Gender <span class="label-hint">(1: Male, 0: Female)</span></label>
                <select id="Gender" name="Gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="1">1 - Male</option>
                    <option value="0">0 - Female</option>
                </select>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="Age">Age</label>
                <input type="number" id="Age" name="Age" placeholder="e.g. 25" required>
            </div>

            <!-- Driving License -->
            <div class="form-group">
                <label for="Driving_License">Driving License <span class="label-hint">(0: No, 1: Yes)</span></label>
                <select id="Driving_License" name="Driving_License" required>
                    <option value="" disabled selected>Select Status</option>
                    <option value="1">1 - Yes</option>
                    <option value="0">0 - No</option>
                </select>
            </div>

            <!-- Region Code -->
            <div class="form-group">
                <label for="Region_Code">Region Code</label>
                <input type="number" step="0.01" id="Region_Code" name="Region_Code" placeholder="e.g. 28.0" required>
            </div>

            <!-- Previously Insured -->
            <div class="form-group">
                <label for="Previously_Insured">Previously Insured <span class="label-hint">(0: No, 1: Yes)</span></label>
                <select id="Previously_Insured" name="Previously_Insured" required>
                    <option value="" disabled selected>Select Status</option>
                    <option value="1">1 - Yes</option>
                    <option value="0">0 - No</option>
                </select>
            </div>

            <!-- Annual Premium -->
            <div class="form-group">
                <label for="Annual_Premium">Annual Premium</label>
                <input type="number" step="0.01" id="Annual_Premium" name="Annual_Premium" placeholder="e.g. 40000" required>
            </div>

            <!-- Sales Channel -->
            <div class="form-group">
                <label for="Policy_Sales_Channel">Policy Sales Channel</label>
                <input type="number" step="0.01" id="Policy_Sales_Channel" name="Policy_Sales_Channel" placeholder="e.g. 152" required>
            </div>

            <!-- Vintage -->
            <div class="form-group">
                <label for="Vintage">Vintage <span class="label-hint">(Days)</span></label>
                <input type="number" id="Vintage" name="Vintage" placeholder="e.g. 180" required>
            </div>

            <!-- Vehicle Age < 1 Year -->
            <div class="form-group">
                <label for="Vehicle_Age_lt_1_Year">Vehicle Age < 1 Year <span class="label-hint">(0: No, 1: Yes)</span></label>
                <select id="Vehicle_Age_lt_1_Year" name="Vehicle_Age_lt_1_Year" required>
                    <option value="" disabled selected>Select Option</option>
                    <option value="1">1 - Yes</option>
                    <option value="0">0 - No</option>
                </select>
            </div>

            <!-- Vehicle Age > 2 Years -->
            <div class="form-group">
                <label for="Vehicle_Age_gt_2_Years">Vehicle Age > 2 Years <span class="label-hint">(0: No, 1: Yes)</span></label>
                <select id="Vehicle_Age_gt_2_Years" name="Vehicle_Age_gt_2_Years" required>
                    <option value="" disabled selected>Select Option</option>
                    <option value="1">1 - Yes</option>
                    <option value="0">0 - No</option>
                </select>
            </div>

            <!-- Vehicle Damage -->
            <div class="form-group full-width">
                <label for="Vehicle_Damage_Yes">Vehicle Damage <span class="label-hint">(0: No, 1: Yes)</span></label>
                <select id="Vehicle_Damage_Yes" name="Vehicle_Damage_Yes" required>
                    <option value="" disabled selected>Select Status</option>
                    <option value="1">1 - Yes (Damage)</option>
                    <option value="0">0 - No (Clean)</option>
                </select>
            </div>

            <button type="submit">Predict Result</button>
        </form>

        {% if context %}
            <div class="result-box">
                <h2>Result: {{ context }}</h2>
            </div>
        {% endif %}
    </div>

</body>
</html>
