<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --text-color: #ffffff;
            --input-bg: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Grid Layout for Form */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two columns */
            gap: 20px;
        }

        /* Spanning the buttons across full width */
        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 300;
            opacity: 0.9;
        }

        input {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Remove arrows/spinners from number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button[type="submit"]:not(.train-button) {
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: white;
            margin-top: 10px;
        }

        .train-button {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .train-button:hover {
            background: rgba(255,255,255,0.1);
            border-color: white;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            border-radius: 8px;
            text-align: center;
        }

        /* Responsive for mobile */
        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr; /* Stack on mobile */
            }
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vehicle Insurance Prediction</h1>

        <form method="post" action="/">
            <div class="form-group">
                <label for="Gender">Gender (1: Male, 0: Female)</label>
                <input type="number" id="Gender" name="Gender" min="0" max="1" required>
            </div>

            <div class="form-group">
                <label for="Age">Age</label>
                <input type="number" id="Age" name="Age" required>
            </div>

            <div class="form-group">
                <label for="Driving_License">Driving License (0: No, 1: Yes)</label>
                <input type="number" id="Driving_License" name="Driving_License" min="0" max="1" required>
            </div>

            <div class="form-group">
                <label for="Region_Code">Region Code</label>
                <input type="number" step="0.01" id="Region_Code" name="Region_Code" required>
            </div>

            <div class="form-group">
                <label for="Previously_Insured">Previously Insured (0-1)</label>
                <input type="number" id="Previously_Insured" name="Previously_Insured" min="0" max="1" required>
            </div>

            <div class="form-group">
                <label for="Annual_Premium">Annual Premium</label>
                <input type="number" step="0.01" id="Annual_Premium" name="Annual_Premium" required>
            </div>

            <div class="form-group">
                <label for="Policy_Sales_Channel">Policy Sales Channel</label>
                <input type="number" step="0.01" id="Policy_Sales_Channel" name="Policy_Sales_Channel" required>
            </div>

            <div class="form-group">
                <label for="Vintage">Vintage</label>
                <input type="number" id="Vintage" name="Vintage" required>
            </div>

            <div class="form-group">
                <label for="Vehicle_Age_lt_1_Year">Vehicle Age < 1 Year (0-1)</label>
                <input type="number" id="Vehicle_Age_lt_1_Year" name="Vehicle_Age_lt_1_Year" min="0" max="1" required>
            </div>

            <div class="form-group">
                <label for="Vehicle_Age_gt_2_Years">Vehicle Age > 2 Years (0-1)</label>
                <input type="number" id="Vehicle_Age_gt_2_Years" name="Vehicle_Age_gt_2_Years" min="0" max="1" required>
            </div>

            <div class="form-group full-width">
                <label for="Vehicle_Damage_Yes">Vehicle Damage (0: No, 1: Yes)</label>
                <input type="number" id="Vehicle_Damage_Yes" name="Vehicle_Damage_Yes" min="0" max="1" required>
            </div>

            <button type="submit" class="full-width">Predict Insurance</button>
        </form>

        <form method="get" action="/train">
            <button type="submit" class="train-button">Train Model</button>
        </form>

        {% if context %}
            <div class="result">
                <h2>Result: {{ context }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
